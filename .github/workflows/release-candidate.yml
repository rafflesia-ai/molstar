name: release candidate

on:
  workflow_dispatch:
    inputs:
      run_render_docker:
        description: "Run strict Docker render smoke"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install renderer libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libcairo2-dev \
            libegl1 \
            libgif-dev \
            libgl1-mesa-dev \
            libglew-dev \
            libglu1-mesa-dev \
            libjpeg-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libxi-dev \
            make \
            pkg-config \
            python3
      - run: npm ci
      - name: Build release candidate
        run: |
          args=(--docker)
          if [ "${{ inputs.run_render_docker }}" = "true" ]; then
            args+=(--render-docker)
          fi
          RC_OUT_DIR="$RUNNER_TEMP/release-candidate" ./scripts/release-candidate.sh "${args[@]}"
      - name: Verify release candidate manifest
        run: |
          python3 - "$RUNNER_TEMP/release-candidate" "${{ inputs.run_render_docker }}" <<'PY'
          import glob
          import json
          import os
          import sys

          root, render_input = sys.argv[1:3]
          manifests = glob.glob(os.path.join(root, "*", "manifest.json"))
          assert manifests, f"no release candidate manifest under {root}"
          with open(sorted(manifests)[-1]) as f:
              manifest = json.load(f)
          assert manifest["ok"] is True, manifest
          assert manifest["platform"]["goos"] == "linux", manifest
          checks = manifest["checks"]
          assert checks["release_gate"] == "passed", checks
          assert checks["artifact_verification"] == "passed", checks
          assert checks["docker_runtime"] == "passed", checks
          assert checks["docker_artifact"] == "passed", checks
          expected_render = "passed" if render_input == "true" else "skipped"
          assert checks["docker_render"] == expected_render, checks
          assert os.path.exists(manifest["artifact"]["path"]), manifest["artifact"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-reports
          path: |
            dist/
            ${{ runner.temp }}/release-candidate
