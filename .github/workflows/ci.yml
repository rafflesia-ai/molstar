name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install system renderer libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libcairo2-dev \
            libegl1 \
            libgif-dev \
            libgl1-mesa-dev \
            libglew-dev \
            libglu1-mesa-dev \
            libjpeg-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libxi-dev \
            make \
            pkg-config \
            python3
      - run: npm ci
      - run: go test ./...
      - run: go vet ./...
      - run: npm run typecheck
      - run: AUDIT_OUT="$RUNNER_TEMP/dependency-audit" npm run audit:deps
      - run: npm run schema
      - run: npm run test:assets
      - run: npm run test:render
      - run: npm run build:all
      - run: npm run assets:cli
      - run: npm run package:local
      - name: Dogfood Mol* CLI
        shell: bash
        run: npm run dogfood:molstar
        env:
          DOGFOOD_OUT_DIR: ${{ runner.temp }}/molstar-dogfood
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: molstar-dogfood-${{ matrix.os }}
          path: ${{ runner.temp }}/molstar-dogfood
      - name: Release artifact smoke
        run: npm run test:artifact
      - run: npm pack --dry-run

  platform-smoke:
    name: platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          bin_path="bin/molstar"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin_path="bin/molstar.exe"
          fi
          ldflags="$(./scripts/build-ldflags.sh)"
          go build -ldflags "$ldflags" -o "$bin_path" ./cmd/molstar
          "$bin_path" version --skip-runtime --json > "$RUNNER_TEMP/version.json"
      - name: Contract and dry-run smoke
        shell: bash
        run: |
          set -euo pipefail
          bin_path="bin/molstar"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin_path="bin/molstar.exe"
          fi
          "$bin_path" job schema --out "$RUNNER_TEMP/job.schema.json"
          "$bin_path" recipe init ligand --id 1cbs --out "$RUNNER_TEMP/ligand.recipe.yaml"
          "$bin_path" recipe validate "$RUNNER_TEMP/ligand.recipe.yaml" --schema --json > "$RUNNER_TEMP/recipe-validate.json"
          "$bin_path" render --demo --dry-run --out "$RUNNER_TEMP/demo.png" --size 64x64 --json > "$RUNNER_TEMP/render-dry-run.json"
          "$bin_path" docs --out "$RUNNER_TEMP/docs"
          "$bin_path" completion all --out-dir "$RUNNER_TEMP/completions"
          test -s "$RUNNER_TEMP/docs/molstar.md"
          test -s "$RUNNER_TEMP/completions/molstar.bash"
      - name: Python wrapper tests
        run: python -m unittest discover -s python/tests

  container-release:
    name: container release verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release in hermetic dev-test image
        run: ./scripts/verify-release-docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-release-docker
          path: dist/verify-release-docker

  linux-renderer:
    name: linux renderer (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [cpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install renderer libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libcairo2-dev \
            libegl1 \
            libgif-dev \
            libgl1-mesa-dev \
            libglew-dev \
            libglu1-mesa-dev \
            libjpeg-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libxi-dev \
            make \
            pkg-config \
            python3
      - run: npm ci
      - run: npm run build:all
      - run: bin/molstar capabilities --probe-worker --json > capabilities.json
      - run: bin/molstar self-test --json --timeout 180s > self-test.json
      - run: bin/molstar bench --iterations 2 --warmup 1 --renderer-mode auto --out-dir outputs/benchmarks/ci-${{ matrix.profile }} --report outputs/benchmarks/ci-${{ matrix.profile }}.json --json > bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-renderer-${{ matrix.profile }}-reports
          path: |
            capabilities.json
            self-test.json
            bench.json
            outputs/benchmarks/ci-${{ matrix.profile }}.json

  linux-gpu-renderer:
    name: linux renderer (gpu self-hosted)
    if: ${{ vars.RUN_MOLSTAR_GPU_CI == '1' }}
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: bin/molstar capabilities --probe-worker --json > capabilities-gpu.json
      - run: bin/molstar self-test --json --timeout 180s > self-test-gpu.json
      - run: bin/molstar bench --iterations 3 --warmup 1 --renderer-mode worker --out-dir outputs/benchmarks/gpu --report outputs/benchmarks/gpu.json --json > bench-gpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-renderer-gpu-reports
          path: |
            capabilities-gpu.json
            self-test-gpu.json
            bench-gpu.json
            outputs/benchmarks/gpu.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t molstar:ci .
      - name: Docker Mol* dogfood
        run: |
          mkdir -p "$RUNNER_TEMP/docker-smoke"
          DOGFOOD_DOCKER_BUILD=0 DOGFOOD_DOCKER_RENDER=auto DOGFOOD_DOCKER_OUT_DIR="$RUNNER_TEMP/docker-smoke" IMAGE=molstar:ci ./scripts/dogfood-molstar-docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke-reports
          path: ${{ runner.temp }}/docker-smoke

  docker-gpu:
    if: ${{ vars.RUN_MOLSTAR_GPU_CI == '1' }}
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t molstar:gpu-ci .
      - name: Docker Mol* GPU dogfood
        run: |
          mkdir -p "$RUNNER_TEMP/docker-gpu-smoke"
          DOGFOOD_DOCKER_BUILD=0 DOGFOOD_DOCKER_GPU=1 DOGFOOD_DOCKER_RENDER=render DOGFOOD_DOCKER_OUT_DIR="$RUNNER_TEMP/docker-gpu-smoke" IMAGE=molstar:gpu-ci ./scripts/dogfood-molstar-docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-gpu-smoke-reports
          path: ${{ runner.temp }}/docker-gpu-smoke
